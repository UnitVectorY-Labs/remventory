<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remventory</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <aside class="library-sidebar">
        <a href="/" class="brand"><span class="brand-mark">r.</span> remventory</a>
        <nav aria-label="Library navigation"><button id="library-home" class="nav-button selected">▦ <span>My collection</span></button><button id="review-changes" class="nav-button">✓ <span>Review changes</span><span id="review-count"></span></button></nav>
        <div class="sidebar-heading">BROWSE TAGS</div><div id="tag-filters" class="tag-filters"></div>
        <button id="manage-fields" class="nav-button">◇ <span>Fields &amp; tag suggestions</span></button>
        <details class="template-filters" open><summary>Creation templates</summary><div class="sidebar-heading">TEMPLATES <button id="add-type" class="plain-button" aria-label="Add field template">+</button></div><div id="type-filters" class="filter-list"></div></details>
      </aside>
      <section class="workspace">
        <header class="library-heading"><div><h1>My collection</h1></div><button id="add-item" type="button">＋ Add item</button></header>
        <header class="remy-panel">
          <img id="remy-avatar" class="remy-avatar" src="/static/remy-ready.svg" alt="Remy is ready">
          <div class="remy-dialog" role="status" aria-live="polite" aria-atomic="true">
            <p id="remy-dialog">What would you like to do?</p>
          </div>
          <button id="browse-inventory" class="secondary" type="button">My collection</button><button id="toggle-remy" class="secondary" type="button" aria-expanded="true">Ask Remy</button>
          <button id="new-chat" class="icon-button secondary" type="button" aria-label="Start a new chat" title="Start a new chat">
            <svg class="icon icon-tabler" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
        </header>

        <div class="request-controls" id="remy-controls">
          <form id="remy-form" class="composer">
            <textarea id="message" name="message" rows="2" placeholder="Ask Remy to find, compare, add, or organize something…" aria-label="Message Remy" required></textarea>
            <div id="submitted-message" class="submitted-message" role="status" aria-label="Submitted request" hidden></div>
            <div class="composer-actions">
              <p id="composer-hint">Enter to send · Shift+Enter for a new line</p>
              <div class="request-action-slot">
                <button id="send-request" type="submit">
                  <span>Send</span>
                  <svg class="icon icon-tabler" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
                </button>
                <button id="stop-request" class="danger" type="button" hidden>
                  <svg class="icon icon-tabler" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
                  <span>Stop</span>
                </button>
              </div>
            </div>
          </form>
        </div>

        <section id="configuration-warning" class="configuration-warning" hidden></section>

        <section id="stage" class="stage" aria-live="polite">
          <div class="empty">
            <h2>Loading collection…</h2>
          </div>
        </section>


      </section>
    </main>
    <dialog id="image-modal" class="image-modal" aria-labelledby="image-modal-title">
      <div class="image-modal-heading">
        <h2 id="image-modal-title">Item picture</h2>
        <button id="close-image-modal" class="icon-button secondary" type="button" aria-label="Close picture">×</button>
      </div>
      <img id="image-modal-content" alt="">
    </dialog>
    <dialog id="catalog-modal" class="catalog-modal" aria-labelledby="catalog-title"></dialog>
    <script src="/static/app.js"></script>
    <script src="/static/library.js"></script>
  </body>
</html>
