<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Remventory</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <aside class="library-sidebar">
        <a href="/" class="brand"><span class="brand-mark">r.</span> remventory</a>
        <nav aria-label="Main navigation">
          <button id="library-home" class="nav-button selected"><img class="icon" src="/static/icons/layout-grid.svg" alt=""> <span>My collection</span></button>
          <button id="review-changes" class="nav-button"><img class="icon" src="/static/icons/check.svg" alt=""> <span>Review changes</span><span id="review-count"></span></button>
          <button id="admin-home" class="nav-button"><img class="icon" src="/static/icons/settings.svg" alt=""> <span>Administration</span></button>
        </nav>
        <div id="collection-navigation"><div class="sidebar-heading">BROWSE TAGS</div><div id="tag-filters" class="tag-filters"></div></div>
      </aside>
      <section class="workspace">
        <header class="library-heading"><div><h1>My collection</h1></div><button id="add-item" type="button"><img class="icon" src="/static/icons/plus.svg" alt=""> Add item</button></header>
        <header class="remy-panel">
          <img id="remy-avatar" class="remy-avatar" src="/static/remy-ready.svg" alt="Remy is ready">
          <div class="remy-dialog" role="status" aria-live="polite" aria-atomic="true">
            <p id="remy-dialog">What would you like to do?</p>
          </div>
          <button id="browse-inventory" class="secondary" type="button">My collection</button><button id="toggle-remy" class="secondary" type="button" aria-expanded="true">Ask Remy</button>
          <button id="new-chat" class="icon-button secondary" type="button" aria-label="Start a new chat" title="Start a new chat">
            <img class="icon" src="/static/icons/pencil.svg" alt="">
          </button>
        </header>

        <div class="request-controls" id="remy-controls">
          <form id="remy-form" class="composer">
            <textarea id="message" name="message" rows="2" placeholder="Ask Remy to find, compare, add, or organize something…" aria-label="Message Remy" required></textarea>
            <div id="submitted-message" class="submitted-message" role="status" aria-label="Submitted request" hidden></div>
            <div class="composer-actions">
              <p id="composer-hint">Enter to send · Shift+Enter for a new line</p>
              <div class="request-action-slot">
                <button id="send-request" type="submit">
                  <span>Send</span>
                  <img class="icon" src="/static/icons/arrow-up.svg" alt="">
                </button>
                <button id="stop-request" class="danger" type="button" hidden>
                  <img class="icon" src="/static/icons/square.svg" alt="">
                  <span>Stop</span>
                </button>
              </div>
            </div>
          </form>
        </div>

        <section id="configuration-warning" class="configuration-warning" hidden></section>

        <section id="stage" class="stage" aria-live="polite">
          <div class="empty">
            <h2>Loading collection…</h2>
          </div>
        </section>


      </section>
    </main>
    <dialog id="image-modal" class="image-modal" aria-labelledby="image-modal-title">
      <div class="image-modal-heading">
        <h2 id="image-modal-title">Item picture</h2>
        <button id="close-image-modal" class="icon-button secondary" type="button" aria-label="Close picture"><img class="icon" src="/static/icons/x.svg" alt=""></button>
      </div>
      <img id="image-modal-content" alt="">
    </dialog>
    <dialog id="catalog-modal" class="catalog-modal" aria-labelledby="catalog-title"></dialog>
    <script src="/static/app.js"></script>
    <script src="/static/library.js"></script>
  </body>
</html>
